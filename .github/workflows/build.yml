# Builds output/document.pdf on GitHub with every push and offers it for
# download: Actions → (run) → link at the top, or Artifacts at the bottom.
# Pushes to main also update the GitHub Page with the latest PDF.
# Pushing a tag like v1.0 also creates a release with the PDF attached.
name: Build PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:      # "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # needed to create releases
    steps:
      - uses: actions/checkout@v5

      # TeX Live in a container. pre_compile writes output/content.tex,
      # then latexmk compiles template.tex with XeLaTeX.
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: template.tex
          texlive_version: 2026          # fixed version: same result every time
          latexmk_use_xelatex: true
          extra_fonts: fonts/*.otf       # install the fonts in fonts/ in the container
          pre_compile: ./build.sh --content-only
          args: >-
            -file-line-error -halt-on-error -interaction=nonstopmode
            -jobname=document -output-directory=output

      # copy the PDF with the creation date in its name, e.g.
      # output/document_2026-11-02_1804.pdf (Zurich time)
      - name: Add the date to the file name
        id: pdf
        run: |
          now=$(date +%s)
          file="document_$(TZ=Europe/Zurich date -d @$now '+%Y-%m-%d_%H%M').pdf"
          cp output/document.pdf "output/$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Europe/Zurich date -d @$now '+%-d %B %Y, %H:%M')" >> "$GITHUB_OUTPUT"

      # upload the PDF as it is (not zipped), the artifact has its file name
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          path: output/${{ steps.pdf.outputs.file }}
          archive: false

      # download link at the top of the run's summary page
      - run: echo "### [Download ${{ steps.pdf.outputs.file }}](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

      # only for tags (v1.0, v2.3, …): release with the PDF
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/${{ steps.pdf.outputs.file }}

      # GitHub Page: site/index.html with file name, date and page count,
      # plus the PDF
      - name: Prepare GitHub Page
        if: github.ref == 'refs/heads/main'
        env:
          FILE: ${{ steps.pdf.outputs.file }}
          DATE: ${{ steps.pdf.outputs.date }}
        run: |
          mkdir -p _site
          cp "output/$FILE" _site/
          pages=$(grep -o '([0-9]* pages' output/document.log | grep -o '[0-9]*')
          sed -e "s/{{FILE}}/$FILE/g" -e "s/{{PAGES}}/$pages/" -e "s/{{DATE}}/$DATE/" \
            site/index.html > _site/index.html

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5

  # publish _site/ as the GitHub Page (only for pushes to main)
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
