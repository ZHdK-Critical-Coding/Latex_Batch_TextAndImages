<!doctype html>
<!-- GitHub Page with a link to the latest PDF. The workflow replaces
     {{DATE}} and {{PAGES}} and publishes this file with document.pdf. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text and Images</title>
  <style>
    :root { color-scheme: light dark; --fg: #111; --bg: #fff; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #111; --muted: #999; } }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 18px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; }
    main { max-width: 32rem; margin: 0 auto; padding: 4rem 1rem; }
    h1 { font-size: 1.6rem; font-weight: normal; margin: 0 0 2rem; }
    a.pdf { display: inline-block; padding: .7rem 1.2rem; border: 1px solid;
            color: inherit; text-decoration: none; }
    a.pdf:hover { background: var(--fg); color: var(--bg); }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Text and Images</h1>
    <a class="pdf" href="document.pdf">document.pdf</a>
    <p>{{PAGES}} pages · built {{DATE}}</p>
  </main>
</body>
</html>
